<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Bazar Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex justify-center pt-10">
    <div class="bg-white w-[380px] p-5 rounded-xl shadow">
        <h1 class="text-xl font-bold text-center mb-4">Daily Bazar Manager</h1>
        <div class="flex gap-2">
            <input id="bazarInput" class="border p-2 w-full rounded" placeholder="what to buy?">
            <button onclick="addBazar()" class="bg-blue-600 text-white px-4 rounded">Add</button>
        </div>
        <ul id="bazarUl" class="mt-4"></ul>
        <p class="text-[11px] text-gray-400 mt-4 text-center">Tools: HTML, Tailwind, JS, LocalStorage</p>
    </div>
    <script src="script.js"></script>
</body>
</html>
